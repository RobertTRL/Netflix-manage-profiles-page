<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Profiles</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <main class="profile-container">
        <h1>Who's watching?</h1>
        
        <div class="profile-list">     
            <div class="profile-item">
                 <button class="profile-button" aria-label="Robert's Profile" id="p1">
                    <img src="pictures/🧩.jpg" alt="Robert's Profile" class="profile-image">
                 </button> 
                 <span class="profile-name">Robert</span>
            </div>
            <div class="profile-item">
                <button class="profile-button" aria-label="Sean's Profile" id="p2">
                    <img src="pictures/WhatsApp Image 2026-03-05 at 4.04.55 PM.jpeg" alt="Sean's Profile" class="profile-image">
                </button> 
                <span class="profile-name">Sean</span>
            </div>
            <div class="profile-item">
                <button class="profile-button" aria-label="Darrel's Profile" id="p3">
                    <img src="pictures/WhatsApp Image 2026-03-05 at 4.04.37 PM.jpeg" alt="Darrel's Profile" class="profile-image">
                </button> 
                <span class="profile-name">Darrel</span>
            </div>
            <div class="profile-item" > 
                <button class="profile-button" aria-label="Risper's Profile" id="p4">
                    <img src="pictures/WhatsApp Image 2026-03-05 at 4.03.58 PM.jpeg" alt="Risper's Profile" class="profile-image">
                </button> 
                <span class="profile-name">Risper</span>
            </div>
            <div class="profile-item" >
                <button class="profile-button" aria-label="Salim's Profile" id="p5">
                    <img src="pictures/WhatsApp Image 2026-03-05 at 4.16.36 PM.jpeg" alt="Salim's Profile" class="profile-image">
                </button> 
                <span class="profile-name">Salim</span>
            </div>
        </div>
    <button class="manage-button">MANAGE PROFILES</button> 
    </main>

</body>
</html>
